name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check secret visibility
        env:
          DUMMY_SECRET: ${{ secrets.DUMMY_SECRET }}
        run: |
          if [ -n "$DUMMY_SECRET" ]; then echo "build: secret is available"; else echo "build: secret is NOT available"; fi
      - name: Build site
        env:
          SITE_TITLE: ${{ vars.SITE_TITLE }}
        run: |
          mkdir _site
          cp -r site/. _site/
          sed -i "s/__COMMIT__/${GITHUB_SHA}/" _site/index.html
          sed -i "s|__TITLE__|${SITE_TITLE}|g" _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check secret visibility
        env:
          DUMMY_SECRET: ${{ secrets.DUMMY_SECRET }}
        run: |
          if [ -n "$DUMMY_SECRET" ]; then echo "deploy: secret is available"; else echo "deploy: secret is NOT available"; fi
          echo "value: $DUMMY_SECRET"
      - id: deployment
        uses: actions/deploy-pages@v5
